name: WEBKAS Supabase migration execution

on:
  push:
    branches:
      - supabase-migration-audit
    paths:
      - "supabase/migration-audit/EXECUTE_MIGRATION"

permissions:
  contents: read

concurrency:
  group: webkas-supabase-migration
  cancel-in-progress: false

jobs:
  restore-database-and-storage:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SOURCE_DB_URL: ${{ secrets.SOURCE_DB_URL }}
      TARGET_DB_URL: ${{ secrets.TARGET_DB_URL }}
      SOURCE_SERVICE_ROLE_KEY: ${{ secrets.SOURCE_SERVICE_ROLE_KEY }}
      TARGET_SERVICE_ROLE_KEY: ${{ secrets.TARGET_SERVICE_ROLE_KEY }}
      SOURCE_SUPABASE_URL: https://lzciyzibqbujshoizlbu.supabase.co
      TARGET_SUPABASE_URL: https://cdqmeenrwsbkcpclitgh.supabase.co

    steps:
      - name: Checkout isolated audit branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Confirm required secrets are present without displaying them
        shell: bash
        run: |
          test -n "$SOURCE_DB_URL" || { echo "Missing SOURCE_DB_URL repository secret."; exit 1; }
          test -n "$TARGET_DB_URL" || { echo "Missing TARGET_DB_URL repository secret."; exit 1; }
          test -n "$SOURCE_SERVICE_ROLE_KEY" || { echo "Missing SOURCE_SERVICE_ROLE_KEY repository secret."; exit 1; }
          test -n "$TARGET_SERVICE_ROLE_KEY" || { echo "Missing TARGET_SERVICE_ROLE_KEY repository secret."; exit 1; }

      - name: Install application dependencies for Storage transfer
        run: npm install

      - name: Restore database in one transaction and verify row checksums
        run: bash scripts/restore-supabase-database.sh

      - name: Transfer private Storage objects and verify SHA-256
        id: storage_transfer
        continue-on-error: true
        run: node scripts/migrate-storage.mjs

      - name: Apply Storage policies and install pg_cron without scheduling jobs
        run: |
          docker pull postgres:17 >/dev/null
          docker run --rm --network host \
            -e DB_URL="$TARGET_DB_URL" \
            -v "$GITHUB_WORKSPACE/supabase/migration-audit:/restore:ro" \
            postgres:17 sh -ec '
              psql "$DB_URL" -X --single-transaction --variable ON_ERROR_STOP=1 \
                --file /restore/restore-storage-policies.sql
              psql "$DB_URL" -X --variable ON_ERROR_STOP=1 \
                --command "CREATE EXTENSION IF NOT EXISTS pg_cron WITH SCHEMA pg_catalog"
            '

      - name: Verify final database, Storage, and Realtime inventory
        env:
          STORAGE_TRANSFER_OUTCOME: ${{ steps.storage_transfer.outcome }}
        run: |
          docker run --rm --network host \
            -e SOURCE_DB_URL="$SOURCE_DB_URL" \
            -e TARGET_DB_URL="$TARGET_DB_URL" \\
            -e STORAGE_TRANSFER_OUTCOME="$STORAGE_TRANSFER_OUTCOME" postgres:17 sh -ec '
              for query in \
                "SELECT count(*) FROM auth.users" \
                "SELECT count(*) FROM auth.identities" \
                "SELECT count(*) FROM storage.buckets"; do
                source_value="$(psql "$SOURCE_DB_URL" -X -A -t -v ON_ERROR_STOP=1 -c "$query")"
                target_value="$(psql "$TARGET_DB_URL" -X -A -t -v ON_ERROR_STOP=1 -c "$query")"
                test "$source_value" = "$target_value"
              done

              if [[ "$STORAGE_TRANSFER_OUTCOME" == "success" ]]; then
                source_objects="$(psql "$SOURCE_DB_URL" -X -A -t -v ON_ERROR_STOP=1 -c "SELECT count(*) FROM storage.objects")"
                target_objects="$(psql "$TARGET_DB_URL" -X -A -t -v ON_ERROR_STOP=1 -c "SELECT count(*) FROM storage.objects")"
                test "$source_objects" = "$target_objects"
              else
                echo "Storage binary transfer is pending; database and Auth restore can still be validated."
              fi

              test "$(psql "$TARGET_DB_URL" -X -A -t -v ON_ERROR_STOP=1 -c "SELECT count(*) FROM pg_policies WHERE schemaname = 'storage'")" = "9"
              test "$(psql "$TARGET_DB_URL" -X -A -t -v ON_ERROR_STOP=1 -c "SELECT count(*) FROM pg_publication_tables WHERE pubname = 'supabase_realtime' AND schemaname = 'public'")" = "11"
              test "$(psql "$TARGET_DB_URL" -X -A -t -v ON_ERROR_STOP=1 -c "SELECT count(*) FROM pg_extension WHERE extname = 'pg_cron'")" = "1"

              if [[ "$STORAGE_TRANSFER_OUTCOME" != "success" ]]; then
                echo "Storage binary transfer did not complete; refusing to mark migration successful."
                exit 1
              fi
            '
          echo "Database, Auth, Storage objects, policies, Realtime, and pg_cron inventory checks passed."

      - name: Confirm cron jobs remain unscheduled
        run: |
          docker run --rm --network host -e DB_URL="$TARGET_DB_URL" postgres:17 sh -ec '
            jobs="$(psql "$DB_URL" -X -A -t -v ON_ERROR_STOP=1 -c "SELECT count(*) FROM cron.job")"
            test "$jobs" = "0" || { echo "Unexpected cron jobs exist; do not cut over."; exit 1; }
          '

      - name: Final source-to-target row parity (read-only source; fail closed on changes)
        run: bash scripts/restore-supabase-database.sh

