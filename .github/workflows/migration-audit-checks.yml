name: Migration audit checks

on:
  push:
    branches:
      - supabase-migration-audit
      - fix/rank-emblem-avatar-no-profile-storage-20261107
    paths:
      - "scripts/**"
      - "supabase/migration-audit/**"
      - "src/lib/supabase.js"
      - "src/App.jsx"
      - "supabase/migrations/**"
      - "supabase/functions/**"
      - ".env.example"
      - ".github/workflows/migration-audit-checks.yml"
      - ".github/workflows/webkas-supabase-migration.yml"
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - supabase-migration-audit
    paths:
      - "scripts/**"
      - "supabase/migration-audit/**"
      - "src/lib/supabase.js"
      - "src/App.jsx"
      - "supabase/migrations/**"
      - "supabase/functions/**"
      - ".env.example"
      - ".github/workflows/migration-audit-checks.yml"
      - ".github/workflows/webkas-supabase-migration.yml"

permissions:
  contents: read

jobs:
  static-and-sql-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout audit branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check database restore shell syntax
        run: bash -n scripts/restore-supabase-database.sh

      - name: Parse gated migration workflow YAML
        run: ruby -e 'require "yaml"; YAML.load_file(".github/workflows/webkas-supabase-migration.yml")'

      - name: Check Storage transfer JavaScript syntax
        run: node --check scripts/migrate-storage.mjs

      - name: Confirm audit client points to the target project
        run: |
          grep -q "https://cdqmeenrwsbkcpclitgh.supabase.co" src/lib/supabase.js
          grep -q "sb_publishable_um2IJ0PsPMFk3oIHuY8L_g_N_oQymfP" src/lib/supabase.js
          ! grep -q "lzciyzibqbujshoizlbu.supabase.co" src/lib/supabase.js

      - name: Install app dependencies
        run: npm install

      - name: Build frontend without deploying
        run: npm run build

      - name: Check payment Edge Function TypeScript syntax
        run: ./node_modules/.bin/esbuild supabase/functions/review-payment/index.ts supabase/functions/delete-completed-payment-history/index.ts --bundle --outdir=/tmp/webkas-edge-check --platform=neutral --format=esm --external:https://*

      - name: Start temporary PostgreSQL for restore-SQL syntax checks
        run: |
          docker run -d --name migration-sql-check \
            -e POSTGRES_PASSWORD=temporary-test-only \
            -v "$GITHUB_WORKSPACE/supabase/migration-audit:/restore:ro" \
            postgres:17 -c wal_level=logical
          for attempt in $(seq 1 40); do
            if docker exec migration-sql-check pg_isready -U postgres >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done
          docker exec migration-sql-check pg_isready -U postgres

      - name: Create minimal Supabase-shaped SQL test schema
        run: |
          docker exec migration-sql-check psql -U postgres -v ON_ERROR_STOP=1 -c "
            CREATE ROLE authenticated NOLOGIN;
            CREATE SCHEMA auth;
            CREATE SCHEMA storage;
            CREATE SCHEMA private;
            CREATE TABLE auth.users (id uuid PRIMARY KEY, raw_user_meta_data jsonb);
            CREATE FUNCTION auth.uid() RETURNS uuid LANGUAGE sql STABLE AS \$\$ SELECT NULL::uuid \$\$;
            CREATE TABLE storage.objects (name text, bucket_id text);
            CREATE FUNCTION storage.foldername(text) RETURNS text[] LANGUAGE sql IMMUTABLE AS \$\$ SELECT string_to_array(\$1, '/') \$\$;
            CREATE FUNCTION private.is_admin_assistant() RETURNS boolean LANGUAGE sql AS \$\$ SELECT false \$\$;
            CREATE FUNCTION private.is_developer() RETURNS boolean LANGUAGE sql AS \$\$ SELECT false \$\$;
            CREATE FUNCTION private.is_admin() RETURNS boolean LANGUAGE sql AS \$\$ SELECT false \$\$;
            CREATE FUNCTION private.is_active_profile_photo_owner(text) RETURNS boolean LANGUAGE sql AS \$\$ SELECT false \$\$;
            CREATE TABLE public.member_profiles (id uuid, display_name text, login_username text, role text, status text, rank_code text);
            CREATE TABLE public.member_wallets (member_id uuid);
            CREATE TABLE public.admin_audit_log (id bigint);
            CREATE TABLE public.dues_settings (id bigint);
            CREATE TABLE public.information_messages (id bigint);
            CREATE TABLE public.payment_submissions (id bigint);
            CREATE TABLE public.wallet_transactions (id bigint);
            CREATE PUBLICATION supabase_realtime;
          "

      - name: Apply captured restore SQL in temporary PostgreSQL
        run: |
          docker exec migration-sql-check psql -U postgres -v ON_ERROR_STOP=1 --single-transaction \
            -f /restore/restore-auth-customizations.sql \
            -f /restore/restore-storage-policies.sql \
            -f /restore/restore-realtime-publication.sql

      - name: Verify trigger, Storage policies, and Realtime table membership
        run: |
          docker exec migration-sql-check psql -U postgres -v ON_ERROR_STOP=1 -Atc "
            SELECT
              (SELECT count(*) FROM pg_trigger WHERE tgname='on_auth_user_created' AND NOT tgisinternal) = 1
              AND (SELECT count(*) FROM pg_policies WHERE schemaname='storage') = 9
              AND (SELECT count(*) FROM pg_publication_tables WHERE pubname='supabase_realtime' AND schemaname='public') = 7;
          " | grep -qx t

      - name: Stop temporary PostgreSQL
        if: always()
        run: docker rm -f migration-sql-check >/dev/null 2>&1 || true
