name: WEBKAS database connection preflight

on:
  push:
    branches:
      - supabase-migration-audit
    paths:
      - ".github/workflows/supabase-connection-preflight.yml"

permissions:
  contents: read

jobs:
  read-only-connectivity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SOURCE_DB_URL: ${{ secrets.SOURCE_DB_URL }}
      TARGET_DB_URL: ${{ secrets.TARGET_DB_URL }}
    steps:
      - name: Check required database secrets exist without displaying them
        shell: bash
        run: |
          set +x
          test -n "$SOURCE_DB_URL" || { echo "SOURCE_DB_URL is missing."; exit 1; }
          test -n "$TARGET_DB_URL" || { echo "TARGET_DB_URL is missing."; exit 1; }
          echo "Both database secrets are present."

      - name: Install PostgreSQL client
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client

      - name: Test source database with a read-only query
        shell: bash
        run: |
          set +x
          result="$(PGCONNECT_TIMEOUT=15 psql "$SOURCE_DB_URL" -X -A -t -v ON_ERROR_STOP=1 -c 'SELECT current_database();')"
          test "$result" = "postgres"
          echo "Source database connection succeeded; SELECT-only check passed."

      - name: Test target database with a read-only query
        shell: bash
        run: |
          set +x
          result="$(PGCONNECT_TIMEOUT=15 psql "$TARGET_DB_URL" -X -A -t -v ON_ERROR_STOP=1 -c 'SELECT current_database();')"
          test "$result" = "postgres"
          echo "Target database connection succeeded; SELECT-only check passed."
