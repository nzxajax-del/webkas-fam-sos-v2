name: WEBKAS database connection preflight

on:
  push:
    branches:
      - supabase-migration-audit
    paths:
      - ".github/workflows/supabase-connection-preflight.yml"

permissions:
  contents: read

jobs:
  read-only-connectivity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SOURCE_DB_URL: ${{ secrets.SOURCE_DB_URL }}
      TARGET_DB_URL: ${{ secrets.TARGET_DB_URL }}
    steps:
      - name: Check required database secrets exist without displaying them
        shell: bash
        run: |
          set +x
          test -n "$SOURCE_DB_URL" || { echo "SOURCE_DB_URL is missing."; exit 1; }
          test -n "$TARGET_DB_URL" || { echo "TARGET_DB_URL is missing."; exit 1; }
          echo "Both database secrets are present."

      - name: Install PostgreSQL client
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client

      - name: Test source database with a read-only query
        shell: bash
        run: |
          set +x
          python3 - <<'PY'
          import os
          import subprocess
          from urllib.parse import urlsplit, unquote

          raw = os.environ["SOURCE_DB_URL"].strip()
          parsed = urlsplit(raw)
          if parsed.scheme not in ("postgres", "postgresql") or not parsed.hostname:
              raise SystemExit("SOURCE_DB_URL format check failed (scheme/host).")
          try:
              port = parsed.port or 5432
          except ValueError:
              raise SystemExit("SOURCE_DB_URL port format check failed.")
          env = os.environ.copy()
          env.update({
              "PGHOST": parsed.hostname,
              "PGPORT": str(port),
              "PGUSER": unquote(parsed.username or ""),
              "PGPASSWORD": unquote(parsed.password or ""),
              "PGDATABASE": unquote(parsed.path.lstrip("/")),
              "PGCONNECT_TIMEOUT": "15",
          })
          if not all((env["PGUSER"], env["PGPASSWORD"], env["PGDATABASE"])):
              raise SystemExit("SOURCE_DB_URL is missing username, password, or database.")
          result = subprocess.run(
              ["psql", "-X", "-A", "-t", "-v", "ON_ERROR_STOP=1", "-c", "SELECT current_database();"],
              env=env, text=True, capture_output=True
          )
          if result.returncode:
              print("Source database connection failed; psql returned an error without exposing connection credentials.")
              print(result.stderr.strip())
              raise SystemExit(result.returncode)
          if result.stdout.strip() != "postgres":
              raise SystemExit("Source database connected but returned an unexpected database name.")
          print("Source database connection succeeded; SELECT-only check passed.")
          PY

      - name: Test target database with a read-only query
        shell: bash
        run: |
          set +x
          python3 - <<'PY'
          import os
          import subprocess
          from urllib.parse import urlsplit, unquote

          raw = os.environ["TARGET_DB_URL"].strip()
          parsed = urlsplit(raw)
          if parsed.scheme not in ("postgres", "postgresql") or not parsed.hostname:
              raise SystemExit("TARGET_DB_URL format check failed (scheme/host).")
          try:
              port = parsed.port or 5432
          except ValueError:
              raise SystemExit("TARGET_DB_URL port format check failed.")
          env = os.environ.copy()
          env.update({
              "PGHOST": parsed.hostname,
              "PGPORT": str(port),
              "PGUSER": unquote(parsed.username or ""),
              "PGPASSWORD": unquote(parsed.password or ""),
              "PGDATABASE": unquote(parsed.path.lstrip("/")),
              "PGCONNECT_TIMEOUT": "15",
          })
          if not all((env["PGUSER"], env["PGPASSWORD"], env["PGDATABASE"])):
              raise SystemExit("TARGET_DB_URL is missing username, password, or database.")
          result = subprocess.run(
              ["psql", "-X", "-A", "-t", "-v", "ON_ERROR_STOP=1", "-c", "SELECT current_database();"],
              env=env, text=True, capture_output=True
          )
          if result.returncode:
              print("Target database connection failed; psql returned an error without exposing connection credentials.")
              print(result.stderr.strip())
              raise SystemExit(result.returncode)
          if result.stdout.strip() != "postgres":
              raise SystemExit("Target database connected but returned an unexpected database name.")
          print("Target database connection succeeded; SELECT-only check passed.")
          PY
