name: WEBKAS database connection preflight

on:
  push:
    branches:
      - supabase-migration-audit
    paths:
      - ".github/workflows/supabase-connection-preflight.yml"

permissions:
  contents: read

jobs:
  read-only-connectivity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SOURCE_DB_URL: ${{ secrets.SOURCE_DB_URL }}
      TARGET_DB_URL: ${{ secrets.TARGET_DB_URL }}
    steps:
      - name: Check required database secrets exist without displaying them
        shell: bash
        run: |
          set +x
          test -n "$SOURCE_DB_URL" || { echo "SOURCE_DB_URL is missing."; exit 1; }
          test -n "$TARGET_DB_URL" || { echo "TARGET_DB_URL is missing."; exit 1; }
          echo "Both database secrets are present."

      - name: Install PostgreSQL client
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client

      - name: Test source and target databases with read-only queries
        shell: bash
        run: |
          set +x
          python3 - <<'PY'
          import os
          import subprocess
          from urllib.parse import urlsplit, unquote

          def check(label, variable):
              raw = os.environ[variable].strip().lstrip("\\ufeff")
              # GitHub secrets are sometimes pasted with surrounding quote marks.
              if len(raw) >= 2 and raw[0] == raw[-1] and raw[0] in ("'", '"'):
                  raw = raw[1:-1].strip()
              try:
                  parsed = urlsplit(raw)
                  scheme_ok = parsed.scheme in ("postgres", "postgresql")
                  host = parsed.hostname
              except ValueError:
                  scheme_ok = False
                  host = None
                  parsed = None

              if not scheme_ok or not host:
                  # Safe diagnostics only: never print the secret or any URI component.
                  has_linebreak = ("\\n" in raw or "\\r" in raw)
                  wrapped_in_quotes = (len(raw) >= 2 and raw[0] == raw[-1] and raw[0] in ("'", '"'))
                  print(f"{label}: URI format invalid; scheme_ok={scheme_ok}, host_present={bool(host)}, "
                        f"starts_with_postgresql={raw.lower().startswith('postgresql://')}, "
                        f"starts_with_postgres={raw.lower().startswith('postgres://')}, "
                        f"has_at_sign={'@' in raw}, has_linebreak={has_linebreak}, "
                        f"wrapped_in_quotes={wrapped_in_quotes}.")
                  raise SystemExit(1)

              try:
                  port = parsed.port or 5432
              except ValueError:
                  print(f"{label}: URI port format invalid.")
                  raise SystemExit(1)

              env = os.environ.copy()
              env.update({
                  "PGHOST": host,
                  "PGPORT": str(port),
                  "PGUSER": unquote(parsed.username or ""),
                  "PGPASSWORD": unquote(parsed.password or ""),
                  "PGDATABASE": unquote(parsed.path.lstrip("/")),
                  "PGCONNECT_TIMEOUT": "15",
              })
              if not all((env["PGUSER"], env["PGPASSWORD"], env["PGDATABASE"])):
                  print(f"{label}: URI is missing username, password, or database.")
                  raise SystemExit(1)

              result = subprocess.run(
                  ["psql", "-X", "-A", "-t", "-v", "ON_ERROR_STOP=1",
                   "-c", "SELECT current_database();"],
                  env=env, text=True, capture_output=True
              )
              if result.returncode:
                  print(f"{label}: database connection failed; PostgreSQL returned:")
                  print(result.stderr.strip())
                  raise SystemExit(result.returncode)
              if result.stdout.strip() != "postgres":
                  print(f"{label}: connected, but returned an unexpected database name.")
                  raise SystemExit(1)
              print(f"{label}: connection succeeded; SELECT-only check passed.")

          check("SOURCE_DB_URL", "SOURCE_DB_URL")
          check("TARGET_DB_URL", "TARGET_DB_URL")
          PY
